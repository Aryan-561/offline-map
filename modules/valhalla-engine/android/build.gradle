plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.valhallaengine'
version = '0.1.0'

android {
  namespace "expo.modules.valhallaengine"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation("io.github.rallista:valhalla-mobile:0.6.4")
  implementation("io.github.rallista:valhalla-models:0.6.0")
  implementation("io.github.rallista:valhalla-models-config:0.6.0")
  implementation("com.stadiamaps:osrm-openapi:0.0.10")
  implementation("com.squareup.moshi:moshi:1.15.1")
}
